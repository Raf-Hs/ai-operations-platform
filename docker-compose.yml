services:
  postgres:
    image: postgres:17
    container_name: ai-operations-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_operations
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: